# formcanvas.ali-moradi-develop.com -> the web container on 127.0.0.1:3112.
# Save as /etc/nginx/sites-available/formcanvas, symlink into sites-enabled,
# `nginx -t`, `systemctl reload nginx`. certbot --nginx then adds the TLS
# block; edit the live file by hand after that.

# A second layer behind the app's own limits (docs/security.md): per address.
limit_req_zone $binary_remote_addr zone=formcanvas_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name formcanvas.ali-moradi-develop.com;

    server_tokens off;
    # uploads are capped at 50 MB by the app
    client_max_body_size 51m;

    # dotfiles (.env, .git), but not Let's Encrypt's /.well-known/
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location /api/ {
        limit_req zone=formcanvas_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (rate limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (rate limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
