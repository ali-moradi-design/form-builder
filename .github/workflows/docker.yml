# Builds the web image after CI passed on main, then deploy-kit deploys it:
# the server pulls formcanvas-web:<sha> and restarts (deploy-app).
# The image holds only the build output (apps/web/.next/standalone).
name: Docker

on:
  # Build only after CI passed on main (works also when main is not protected).
  workflow_run: # zizmor: ignore[dangerous-triggers] only same-repo pushes to main pass the `if` below
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-main
  cancel-in-progress: false

jobs:
  image:
    name: Build and push the image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # builds the packages and the web app, then completes .next/standalone
      - run: pnpm turbo run build --filter=@formcanvas/web
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          IMAGE: ghcr.io/ali-moradi-design/formcanvas-web:${{ steps.sha.outputs.sha }}
        run: |
          docker build -f apps/web/Dockerfile -t "$IMAGE" apps/web/.next/standalone
          docker push "$IMAGE"

  deploy:
    needs: image
    uses: ali-moradi-design/deploy-kit/.github/workflows/deploy-app.yml@ed4a1649d523120609b56471f232facb73e32fb0 # v1.0.0
    # the deploy job needs the environment's SSH secrets; deploy-kit is ours
    # and pinned to a SHA, so passing them on is safe
    secrets: inherit # zizmor: ignore[secrets-inherit]
    with:
      image-tag: ${{ needs.image.outputs.sha }}
      site-url: https://formcanvas.ali-moradi-develop.com
      smoke-paths: / /templates /sign-in /api/health /embed.js
