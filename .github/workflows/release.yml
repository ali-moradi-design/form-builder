name: Release

# On every push to main, Changesets either opens (or updates) the
# "Version packages" PR, or, when that PR was just merged, publishes the
# new versions to npm with provenance.

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:package
      # v2 renamed the inputs and takes the token from `github-token`
      # (default: this workflow's token), not from the environment.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
          pr-title: Version packages
          commit-message: Version packages
        # npm accepts this workflow through trusted publishing (OIDC), so
        # no npm token is stored anywhere.
